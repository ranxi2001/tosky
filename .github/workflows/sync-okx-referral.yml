name: Sync OKX registration link

on:
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Render and validate without pushing main or triggering deployment
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: okx-registration-link-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: /data/development/cache/ms-playwright
    steps:
      - name: Check out main
        # actions/checkout v6
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Record the exact main revision to validate
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        # actions/setup-node v6
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          npm ci
          sudo mkdir -p "$PLAYWRIGHT_BROWSERS_PATH"
          sudo chown -R "$(id -u):$(id -g)" /data/development/cache
          npx --no-install playwright install --with-deps chromium

      - name: Test dynamic rendering and direct main publication
        run: npm run test:okx-referral-sync

      - name: Render public Notion and update only okx.url locally
        run: npm run sync:okx-referral -- --write --report "$RUNNER_TEMP/okx-referral-report.json"

      - name: Validate and build the exact candidate
        run: npm run check

      - name: Enforce the minimal whitelist and detect changes
        id: changes
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-okx-referral.mjs --base "$BASE_SHA" --report "$RUNNER_TEMP/okx-referral-report.json" > "$RUNNER_TEMP/okx-referral-preflight.json"
          changed="$(jq -r .changed "$RUNNER_TEMP/okx-referral-preflight.json")"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          {
            echo "### OKX 注册入口同步"
            echo "- Chromium 动态正文验证成功；只允许 referrals.json 的 okx.url 变化。"
            echo "- 需要更新 main：$changed；dry-run：$DRY_RUN。"
            echo "- 动态加载、直接推送测试和完整 npm run check / build 已通过。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create a Contents-only short-lived GitHub App token
        id: app-token
        if: steps.changes.outputs.changed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        # App installation tokens trigger the existing main push deployment workflow.
        # actions/create-github-app-token v3; installed only on this repository.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.OKX_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.OKX_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Fast-forward main using the App identity
        if: steps.changes.outputs.changed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git
          node scripts/publish-okx-referral.mjs --base "$BASE_SHA" --report "$RUNNER_TEMP/okx-referral-report.json" --push
          echo "- App 已非 force 推送已校验的最小提交到 main；push 事件交给既有 deploy.yml 重新校验并部署。" >> "$GITHUB_STEP_SUMMARY"
